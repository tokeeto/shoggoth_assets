<!DOCTYPE html>
<html>
<head>
	<title>{{project.name}}</title>
	<link rel="preload" href="file://{{frontpage}}" as="image" type="image/avif" />
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="preload" href="file://{{a4_empty}}" as="image" type="image/avif" />
	<link rel="preload" href="file://{{a4_title}}" as="image" type="image/avif" />
	<style>

		@page {
			size: A4;
			padding: 0;
			margin: 15mm;
			margin-bottom: 12mm;
			background-image: url("file://{{a4_empty}}");
			background-size: cover;
			background-attachment: fixed bleed;
			background-repeat: no-repeat;
			bleed: 3mm;
			@bottom-center {
		    	content: counter(page);
		    	font-family: Bolton;
		    	margin-bottom: 7.5mm;
		    	font-size: 150%;
		 	}
		}

		@page cover {
			background-image: url("file://{{frontpage}}");
			background-size: contain;
			@bottom-center {
		    	content: none;
		 	}
		}

		@page :nth(2) {
			background-image: url("file://{{a4_title}}");
			margin-top: 75mm;

			@bottom-center {
		    	content: none;
		 	}
		}

		html, body {
			padding: 0;
			margin: 0;
		}

		.intro {
			page: intro;
		}

		.cover {
			page: cover;
			break-after: page;
		}

		@font-face {
			font-family: "Arno Pro";
			src: url('file://{{arno_pro}}');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: "Arno Pro";
			src: url('file://{{arno_pro_bold}}');
			font-weight: bold;
			font-style: normal;
		}
		@font-face {
			font-family: "Arno Pro";
			src: url('file://{{arno_pro_bolditalic}}');
			font-weight: bold;
			font-style: italic;
		}
		@font-face {
			font-family: "Arno Pro";
			src: url('file://{{arno_pro_italic}}');
			font-weight: normal;
			font-style: italic;
		}
		@font-face {
			font-family: "Teutonic";
			src: url('file://{{teutonic}}');
		}
		@font-face {
			font-family: "AHLCGSymbol";
			src: url('file://{{ahlcgsymbol}}');
		}
		@font-face{
			font-family: "Bolton";
			src: url('file://{{bolton}}');
		}

		/* general styles */
		body {
			font-family: "Arno Pro";
			font-size: 9pt;
		}
		h1, h2, h3, h4 {
			font-family: Teutonic;
			color: #2d5b58;
		}
		h1 {
			font-size: 22pt;
			border-bottom: 3px double #2d5b58;
		}
		h2 {
			font-size: 16pt;
			border-bottom: 3px double #2d5b58;
		}
		h3, h4, h5 {
			color: black;
		}
		h5 {
			font-size: 10pt;
			font-weight: 800;
			margin-bottom: 0;
		}
		p {
			line-height: 1.18;
			text-align: justify;
		}
		p, ul, li {
			margin: 0 0 .5em 0;
		}

		.chapter {
			break-after: page;
			column-count: 2;
			column-fill: auto;
		}

		/* resolution styles */
		.resolution_box {
			padding: 0;
			position: relative;
		}
		.resolution_box .glyph {
			width: 100%;
			position: absolute;
		}
		.resolution_box .glyph.top {
			top: -10px;
		}
		.resolution_box .glyph.bottom {
			bottom: 12px;
		}
		.resolution_box .content {
			border-radius: 5mm;
			padding: .5em;
			margin: 0 2em 2em 2em;
			background-color: rgba(91, 45, 45, .2);
			box-shadow: 0 0 1em 1em rgba(91, 45, 45, .2);
		}
		.resolution_box h2, .resolution_box h3 {
			color: rgba(91, 45, 45, 1);
		}
		.resolution_box h2 {
			text-align: center;
			border-bottom: 3px double rgba(91, 45, 45, 1);
		}

		/* resolution style used for information */
		.red_box {
			border-radius: 3mm;
			padding: 0 .4em;
			margin: 2em;
			background-color: rgba(91, 45, 45, .2);
			box-shadow: 0 0 1em 1em rgba(91, 45, 45, .2);
		}

		/* standalone mode instructions (aka green box) */
		.standalone_box {
			padding: 0;
			position: relative;
		}
		.standalone_box .glyph {
			width: 100%;
			position: absolute;
		}
		.standalone_box .glyph.top {
			top: -10px;
		}
		.standalone_box .glyph.bottom {
			bottom: 12px;
		}
		.standalone_box .content {
			border-radius: 5mm;
			padding: .5em;
			margin: 0 2em 2em 2em;
			background-color: rgba(45, 91, 45, .2);
			box-shadow: 0 0 1em 1em rgba(45, 91, 45, .2);
		}
		.standalone_box h2 {
			text-align: center;
			border-bottom: 3px double #2d5b58;
		}

		/* general box stuff
			h2 elements needs to be centeredto only have borders under content
		*/
		.content {
			text-align: center;
		}
		.content h2 {
			display: inline-block;
			margin-top: 0;
			margin-bottom: 1em;
		}
		.content > * {
			text-align: justify;
		}

		.story {
			font-style: italic;
		}
		.story em {
			font-style: normal;
		}
		.story strong {
			font-weight: bold;
		}

		.codex {
			border: 2px solid #2d5b58;
			border-radius: 5mm;
			padding: 1em;
			box-shadow: inset 0 0 2em #2d5b58;
			background-color: rgba(40, 100, 100, 0.1);
			break-inside: avoid;
			margin-top: 1em;
		}
		.codex > h2 {
			color: black;
			font-family: Arno Pro;
			border-bottom: none;
		}

		/* Copy of codex that breaks at columns */
		.green_box {
			border: 2px solid #2d5b58;
			border-radius: 5mm;
			padding: 1em;
			box-shadow: inset 0 0 2em #2d5b58;
			background-color: rgba(40, 100, 100, 0.1);
			break-inside: inherit;
			margin-top: 1em;
		}
		.green_box > h2 {
			color: black;
			font-family: Arno Pro;
			border-bottom: none;
		}

		/* Boxes for each class */

		.center, .center > p {
			text-align: center;
		}
		.italic {
			font-style: italic;
		}
		.bold {
			font-weight: 800;
		}
		.right, .right > p {
			text-align: right;
		}

		ul {
			list-style: none;
			margin-left: 0;
			padding-left: 1.6em;
		}
		ul > li {
			position: relative;
		}
		ul > li:before {
			content: 'B';
			color: #2d5b58;
			font-family: AHLCGSymbol;
			position: absolute;
			left: -1.5em;
		}
		.bullet ul {
			padding-left: 1.2em;
		}
		.bullet ul > li:before {
			content: 'b';
			color: #34391d;
			left: -1.1em;
		}
		.resolution_box ul > li:before {
			color: rgb(91, 45, 45);
		}
		.icon {
			font-family: "AHLCGSymbol";
		}
		.top {
			column-span: all;
			width: 100%;
			display: block;
			margin-bottom: 1em;
		}
		.bottom {
			column-span: all;
			width: 100%;
			-prince-float: bottom;
			margin-top: 1em;
		}
		.column {
			width: 100%;
			break-after: column;
			break-before: column;
			display: block;
		}
		.block {
			width: 100%;
			display: block;
			mask: url(#svg-mask);
		}
		.location-overview {
			width: 100%;
		}

		.toc > a {
			display: block;
			color: black;
			text-decoration: none;
		}
		.toc > a:after {
			content: leader('.') target-counter(attr(href), page)
		}
		.toc .title {
			white-space: nowrap;
		}
		.toc {
			width: 88%;
			margin-left: 6%;
			margin-top: -15px;
		}
		.encounter-icon {
			height: 3em;
		}
		.project-icon {
			height: 5em;
		}
		.pagebreak {
			page-break-after: always;
			width: 0;
			height: 0;
		}

		.wide {
			column-span: all;
		}
		.trait {
			font-weight: bold;
			font-style: italic;
		}
	</style>
	<style>
		@media screen {
			html {
				width: 210mm;
				background-color: #333;
			}
			body {
				background-color: white;
				background-image: url("file://{{a4_empty}}");
				background-repeat: repeat-y;
				background-size: contain;
				padding: 10mm;
			}
			.chapter {
				width: 100%;
				box-sizing: border-box;
				column-fill: balance;
			}
		}
	</style>
</head>
<body>

</body>
</html>
